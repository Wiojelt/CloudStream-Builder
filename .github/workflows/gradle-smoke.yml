name: Gradle Configuration Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - build.gradle.kts
      - gradle/**
      - gradlew
      - .github/workflows/gradle-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Gradle wrapper permissions
        run: chmod +x gradlew
      - name: Check Gradle configuration (not a CloudStream plugin build)
        run: ./gradlew help --no-daemon --stacktrace
