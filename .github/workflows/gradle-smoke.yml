name: Gradle Configuration Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - build.gradle.kts
      - gradle/**
      - gradlew
      - .github/workflows/gradle-smoke.yml
  workflow_dispatch:

# Temporary branch-only repair step; restore read-only permissions before merging.
permissions:
  contents: write

jobs:
  configure:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore verified official Gradle 9.4.1 wrapper
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/gradle/gradle/v9.4.1/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          echo '55243ef57851f12b070ad14f7f5bb8302daceeebc5bce5ece5fa6edb23e1145c  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          if ! git diff --quiet -- gradle/wrapper/gradle-wrapper.jar; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add gradle/wrapper/gradle-wrapper.jar
            git commit -m 'fix: restore verified official Gradle 9.4.1 wrapper'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant wrapper execute permission
        run: chmod +x gradlew
      - name: Gradle configuration smoke (no plugin build)
        run: ./gradlew help --no-daemon --stacktrace
