name: Build Plugins

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

       - name: Setup Gradle 8.5
         uses: gradle/actions/setup-gradle@v3
         with:
           gradle-version: '8.5'
        
      - name: Regenerate Wrapper with Gradle 8.5
        run: gradle wrapper --gradle-version 8.5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Eklentileri Derle
        working-directory: ./   # gradlew dosyanız hangi klasördeyse (src veya kök dizin)
        run: ./gradlew make --stacktrace --info

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-plugins
          path: build/*.zip
