name: CSBuilder Skill Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unit tests
        run: python -m unittest discover -s cloudstream-builder/tests -p 'test_*.py' -v

      - name: Check example Kotlin provider
        run: python cloudstream-builder/scripts/audit_provider_contracts.py OrnekProvider.kt

      - name: Inventory legacy extractor warnings
        run: |
          python cloudstream-builder/scripts/audit_provider_contracts.py cloudstream-builder/extractors/turk --json > extractor-preflight.json || true
          python -c "import json; from collections import Counter; data=json.load(open('extractor-preflight.json',encoding='utf-8')); print('Legacy extractor findings:',dict(Counter(x['rule'] for x in data)))"

      - name: Publish preflight inventory
        uses: actions/upload-artifact@v4
        with:
          name: extractor-preflight
          path: extractor-preflight.json
